[project]
name = "FileForge"
version = "1.1.3"
description = "A Python CLI tool for batch file renaming and other useful utilities when it comes to file organization."
authors = [{ name = "Adam Ben-Aamr" }]
dependencies = ["click"]

[project.scripts]
ff = "ff.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
